spring:
  application:
    name: covoiturage
  datasource:
    url: jdbc:postgresql://localhost:5433/covoiturage
    username: covoiturage
    password: covoiturage
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true # bash tban SQL queries f console
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080