spring:
  application:
    name: covoiturage
  datasource:
    url: jdbc:postgresql://localhost:5432/covoiturage
    username: covoiturage
    password: covoiturage
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080